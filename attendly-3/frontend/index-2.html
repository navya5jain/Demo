      return Math.max(0, 3 * total - 4 * attended);

    function getEnrichedStudents() {
      return state.students.map(function(st) {
        const total_classes = st.subject_stats.reduce(function(acc, s) { return acc + s.total; }, 0);
        const attended_classes = st.subject_stats.reduce(function(acc, s) { return acc + s.attended; }, 0);
        const missed_classes = total_classes - attended_classes;
        const overall_percentage = total_classes > 0 ? Number(((attended_classes / total_classes) * 100).toFixed(2)) : 100;
        const classes_needed_for_75 = calcClassesNeededFor75(attended_classes, total_classes);
        const status_color = getBadgeColor(overall_percentage);

        const subject_breakdown = st.subject_stats.map(function(ss) {
          const subj = state.subjects.find(function(sub) { return sub.id === ss.subject_id; }) || state.subjects[0];
          const teacher = state.teachers.find(function(t) { return t.id === (subj ? subj.teacher_id : 2); });
          const pct = ss.total > 0 ? Number(((ss.attended / ss.total) * 100).toFixed(1)) : 100;
          return {
            subject_id: ss.subject_id,
            subject_name: subj ? subj.name : 'Subject',
            subject_code: subj ? subj.code : 'CS500',
            schedule_slot: subj ? subj.schedule_slot : '09:00 AM',
            teacher_name: teacher ? teacher.full_name : 'Faculty',
            total_classes: ss.total,
            attended: ss.attended,
            missed: ss.total - ss.attended,
            percentage: pct,
            status_color: getBadgeColor(pct),
            classes_needed_for_75: calcClassesNeededFor75(ss.attended, ss.total)
          };
        });

        return Object.assign({}, st, {
          total_classes: total_classes,
          attended_classes: attended_classes,
          missed_classes: missed_classes,
          overall_percentage: overall_percentage,
          classes_needed_for_75: classes_needed_for_75,
          status_color: status_color,
          is_redline: overall_percentage < 75.0,
          subject_breakdown: subject_breakdown
        });
      });
    }

      if (state.currentUser && state.currentUser.role === 'student') {
        return enriched.find(function(s) { return s.email.toLowerCase() === state.currentUser.email.toLowerCase(); }) || enriched[0];
      }
      return enriched.find(function(s) { return s.student_id === Number(state.selectedStudentId); }) || enriched[0];
    }

    window.handleLoginSubmit = function(e) {
      e.preventDefault();
      const emailInput = document.getElementById('login-email');
      const email = (emailInput ? emailInput.value : state.loginEmail).trim().toLowerCase();
      const enriched = getEnrichedStudents();

      if (state.selectedPortal === 'student') {
        const foundStudent = enriched.find(function(s) { return s.email.toLowerCase() === email; });
        if (!foundStudent) {
          showToast('Access Denied: Only Student credentials work in the Student Portal! Faculty/Admin cannot log in here.', 'error');
          return;
        }
        state.currentUser = {
          id: foundStudent.student_id,
          full_name: foundStudent.full_name,
          email: foundStudent.email,
          role: 'student',
          roll_or_emp_id: foundStudent.roll_number
        };
        state.selectedStudentId = foundStudent.student_id;
        state.activeTab = 'overview';
        showToast('Welcome to the Student Portal, ' + foundStudent.full_name + '!');
        return;
      }

      if (state.selectedPortal === 'teacher') {
        const foundTeacher = state.teachers.find(function(t) { return t.email.toLowerCase() === email; });
        if (!foundTeacher) {
          showToast('Access Denied: Students cannot log into the Faculty Portal! Use authorized Faculty credentials.', 'error');
          return;
        }
        state.currentUser = Object.assign({}, foundTeacher, { role: 'teacher' });
        state.activeTab = 'faculty_rollcall';
        showToast('Welcome to the Faculty Portal, ' + foundTeacher.full_name + '!');
        return;
      }

      if (state.selectedPortal === 'admin') {
        if (email !== 'admin@attendly.edu') {
          showToast('Access Denied: Restricted to Dean Academics & System Administrators only!', 'error');
          return;
        }
        state.currentUser = {
          id: 1,
          full_name: 'Dr. Rajeshwari Kulkarni (Dean Academics)',
          email: 'admin@attendly.edu',
          role: 'admin',
          roll_or_emp_id: 'ADM-001'

        state.activeTab = 'admin_command';
        showToast('Logged into Executive Admin Command Center');
      }
    };

    window.submitStudentDoubt = function(e) {
      e.preventDefault();
      const enriched = getEnrichedStudents();
      const activeStudent = getActiveStudent(enriched);
      const subjId = Number(document.getElementById('doubt-subject').value);
      const title = document.getElementById('doubt-title').value.trim();
      const desc = document.getElementById('doubt-desc').value.trim();
      const fileEl = document.getElementById('doubt-file');
      const fileName = (fileEl && fileEl.files && fileEl.files[0]) ? fileEl.files[0].name : null;

      if (!title || !desc) return;
      const subj = state.subjects.find(function(s) { return s.id === subjId; }) || state.subjects[0];
      const teacher = state.teachers.find(function(t) { return t.id === subj.teacher_id; }) || state.teachers[0];

      state.doubts.unshift({
        id: Date.now(),
        student_id: activeStudent.student_id,
        student_name: activeStudent.full_name,
        student_roll: activeStudent.roll_number,
        subject_id: subj.id,
        subject_name: subj.name,
        subject_code: subj.code,
        teacher_id: teacher.id,
        teacher_name: teacher.full_name,
        title: title,
        description: desc,
        attachment_name: fileName,
        status: 'Pending',
        teacher_reply: ''
      });
      showToast('Doubt submitted to ' + teacher.full_name + '!');
    };

    window.submitTeacherDoubtReply = function(doubtId) {
      const inputEl = document.getElementById('reply-input-' + doubtId);
      if (!inputEl || !inputEl.value.trim()) return;
      const d = state.doubts.find(function(x) { return x.id === Number(doubtId); });
      if (d) {
        d.teacher_reply = inputEl.value.trim();
        d.status = 'Answered';
        showToast('Response posted and doubt marked as Answered!');
      }
    };

    window.resolveDoubt = function(doubtId) {
      const d = state.doubts.find(function(x) { return x.id === Number(doubtId); });
      if (d) {
        d.status = 'Resolved';
        showToast('Doubt marked as Resolved!');
      }
    };

    window.submitRatingForm = function(e) {
      e.preventDefault();
      const isStudent = state.currentUser.role === 'student';
      const targetId = Number(document.getElementById('rating-target').value);
      const m1 = Number(document.getElementById('rating-m1').value);
      const m2 = Number(document.getElementById('rating-m2').value);
      const m3 = Number(document.getElementById('rating-m3').value);
      const comment = document.getElementById('rating-comment').value.trim();
      const overall = Number(((m1 + m2 + m3) / 3).toFixed(2));

      const targetObj = isStudent
        ? state.teachers.find(function(t) { return t.id === targetId; }) || state.teachers[0]
        : state.students.find(function(s) { return s.student_id === targetId; }) || state.students[0];

      state.ratings.unshift({
        id: Date.now(),
        from_user_name: state.currentUser.full_name + ' (' + (isStudent ? 'Student' : 'Faculty') + ')',
        to_user_name: targetObj.full_name,
        direction: isStudent ? 'student_to_teacher' : 'teacher_to_student',
        overall_score: overall,
        comment: comment || 'Strong academic engagement and constructive interaction.'
      });
      showToast('Submitted ' + overall + '/5.0 rating for ' + targetObj.full_name + '!');

    window.finalizeLeaveDecision = function(statusDecision, convertToPresent) {
      const lv = state.leaveRequests.find(function(x) { return x.id === state.reviewModalLeaveId; });
      if (!lv) return;
      lv.status = statusDecision;
      lv.reviewer_name = state.currentUser.full_name;
      lv.reviewer_comment = statusDecision === 'Approved'
        ? (convertToPresent ? 'Approved with Medical Condonation (Absent converted to Present).' : 'Explanation verified & recorded (Attendance unchanged per policy).')
        : 'Rejected due to insufficient supporting documentation.';
      lv.convert_to_present = convertToPresent;

      if (statusDecision === 'Approved' && convertToPresent) {
        const st = state.students.find(function(s) { return s.student_id === lv.student_id; });
        if (st && st.subject_stats[0]) {
          st.subject_stats[0].attended = Math.min(st.subject_stats[0].total, st.subject_stats[0].attended + 1);
        }
        showToast('Approved AND converted Absent record to Present per college condonation policy!');
      } else {
        showToast('Leave request marked as ' + statusDecision + ' (Attendance unchanged per policy).');
      }
      state.reviewModalLeaveId = null;
      renderApp();
    };

    window.exportReport = function(format) {
      const enriched = getEnrichedStudents();
      if (format === 'excel') {
        const headers = ['Roll Number,Student Name,Department,Semester,Total Classes,Attended,Missed,Attendance %,Status Badge,RED LINE Status,Classes Needed for 75%,Parent Email'];
        const rows = enriched.map(function(s) {
          return s.roll_number + ',"' + s.full_name + '",' + s.department_code + ',' + s.semester + ',' + s.total_classes + ',' + s.attended_classes + ',' + s.missed_classes + ',' + s.overall_percentage + '%,' + s.status_color + ',' + (s.is_redline ? 'BELOW 75% (RED LINE)' : 'SAFE (>=75%)') + ',' + s.classes_needed_for_75 + ',' + s.parent_email;
        });
        const blob = new Blob([[headers].concat(rows).join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ATTENDLY_Attendance_Report_' + state.markSheetDate + '.csv';
        a.click();
        URL.revokeObjectURL(url);

    function renderAttendanceRingSvg(pct) {
      const radius = 50;
      const circum = 2 * Math.PI * radius;
      const offset = circum - (Math.min(100, pct) / 100) * circum;
      const color = pct >= 80 ? '#10b981' : pct >= 75 ? '#f59e0b' : '#f43f5e';
      return (
        '<div class="relative w-28 h-28 flex items-center justify-center shrink-0">' +
          '<svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">' +
            '<circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,0.12)" stroke-width="10" fill="none" />' +
            '<circle cx="60" cy="60" r="50" stroke="' + color + '" stroke-width="10" stroke-dasharray="' + circum + '" stroke-dashoffset="' + offset + '" stroke-linecap="round" fill="none" />' +
          '</svg>' +
          '<div class="absolute inset-0 flex flex-col items-center justify-center text-center">' +
            '<span class="text-xl font-extrabold text-white">' + pct + '%</span>' +
            '<span class="text-[10px] uppercase tracking-wider text-slate-300 font-bold">' + (pct >= 75 ? 'Eligible' : 'Red Line') + '</span>' +
          '</div>' +
        '</div>'
      );
    }

    function renderSubjectBarsHtml(breakdown) {
      return breakdown.map(function(item) {
        const grad = item.percentage >= 80
          ? 'from-emerald-500 to-teal-400'
          : item.percentage >= 75
          ? 'from-amber-500 to-yellow-400'
          : 'from-rose-600 to-pink-500';
        return (
          '<div class="space-y-1.5">' +
            '<div class="flex justify-between text-xs">' +
              '<span class="font-bold text-slate-800">' + escapeHtml(item.subject_code) + ' <span class="font-medium text-slate-500">• ' + escapeHtml(item.subject_name) + '</span></span>' +
              '<span class="font-extrabold text-slate-900">' + item.attended + '/' + item.total_classes + ' (' + item.percentage + '%)</span>' +
            '</div>' +
            '<div class="w-full h-3.5 bg-slate-100 rounded-full overflow-hidden relative">' +
              '<div class="h-full bg-gradient-to-r ' + grad + ' rounded-full" style="width:' + Math.min(100, item.percentage) + '%"></div>' +
              '<div class="absolute top-0 bottom-0 w-0.5 bg-slate-900" style="left:75%" title="75% Mandatory Threshold"></div>' +

    function renderMonthlySvgHtml(reports) {
      const points = reports.map(function(r, idx) {
        return {
          month: r.month,
          percentage: r.percentage,
          x: 65 + idx * 135,
          y: 170 - (r.percentage / 100) * 130
        };
      });
      const poly = points.map(function(p) { return p.x + ',' + p.y; }).join(' ');
      const grid = [25, 50, 75, 100].map(function(val) {
        const y = 170 - (val / 100) * 130;
        const isRed = val === 75;
        return (
          '<line x1="42" y1="' + y + '" x2="365" y2="' + y + '" stroke="' + (isRed ? '#e11d48' : '#e2e8f0') + '" stroke-dasharray="' + (isRed ? '5 4' : '2 2') + '" stroke-width="' + (isRed ? '1.5' : '1') + '" />' +
          '<text x="10" y="' + (y + 4) + '" font-size="10" fill="' + (isRed ? '#e11d48' : '#64748b') + '" font-weight="' + (isRed ? 'bold' : 'normal') + '">' + val + '%</text>'
        );
      }).join('');

      const circles = points.map(function(p) {
        return (
          '<circle cx="' + p.x + '" cy="' + p.y + '" r="6" fill="' + (p.percentage < 75 ? '#e11d48' : '#7c3aed') + '" stroke="#ffffff" stroke-width="2.5" />' +
          '<text x="' + p.x + '" y="' + (p.y - 12) + '" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">' + p.percentage + '%</text>' +
          '<text x="' + p.x + '" y="194" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">' + escapeHtml(p.month) + '</text>'
        );
      }).join('');

      return (
        '<svg viewBox="0 0 400 210" class="w-full h-56">' +
          grid +
          (points.length > 1
            ? '<polygon points="65,170 ' + poly + ' ' + points[points.length - 1].x + ',170" fill="rgba(124,58,237,0.14)" />' +
              '<polyline fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" points="' + poly + '" />'
            : '') +
          circles +
        '</svg>'
      );
    }

            '<div class="p-6 lg:p-8 space-y-6">' + mainContentHtml + '</div>' +

        '</div>';
    }

    // Boot Application Immediately
    renderApp();
  </script>
</body>
