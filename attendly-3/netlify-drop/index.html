    // Animated Circular Attendance Ring Gauge
    const AttendanceRing = ({ percentage }) => {
      const radius = 52;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (Math.min(100, percentage) / 100) * circumference;
      const strokeColor =
        percentage >= 80 ? '#10b981' : percentage >= 75 ? '#f59e0b' : '#f43f5e';

      return (
        <div className="relative w-32 h-32 flex items-center justify-center shrink-0">
          <svg className="w-full h-full -rotate-90" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r={radius} stroke="rgba(255,255,255,0.12)" strokeWidth="10" fill="none" />
            <circle
              cx="60"
              cy="60"
              r={radius}
              stroke={strokeColor}
              strokeWidth="10"
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              fill="none"
            />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className="text-2xl font-extrabold text-white">{percentage}%</span>
            <span className="text-[10px] uppercase tracking-wider text-slate-300 font-semibold">
              {percentage >= 75 ? 'Eligible' : 'Red Line'}
            </span>
          </div>
        </div>
      );

    // Interactive SVG Monthly & Semester Trend Chart
    const MonthlyTrendChart = ({ reports }) => {
      const maxPct = 100;
      const points = reports.map((r, idx) => {

        const y = 170 - (r.percentage / maxPct) * 130;
        return { ...r, x, y };
      });
      const polylinePoints = points.map((p) => `${p.x},${p.y}`).join(' ');

      return (
        <div className="w-full overflow-x-auto">
          <svg viewBox="0 0 400 210" className="w-full h-56">
            <defs>
              <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">

                <stop offset="100%" stopColor="#7c3aed" stopOpacity="0.0" />
              </linearGradient>
            </defs>
            {[25, 50, 75, 100].map((val) => {
              const y = 170 - (val / 100) * 130;
              return (
                <g key={val}>
                  <line
                    x1="42"
                    y1={y}
                    x2="365"
                    y2={y}

                    strokeWidth={val === 75 ? "1.5" : "1"}

                  <text x="10" y={y + 4} fontSize="10" fill={val === 75 ? "#e11d48" : "#64748b"} fontWeight={val === 75 ? "bold" : "normal"}>
                    {val}%
                  </text>
                </g>
              );
            })}

                  points={`65,170 ${polylinePoints} ${points[points.length - 1].x},170`}
                  fill="url(#trendGrad)"

                <polyline

                  strokeWidth="3.5"
                  strokeLinecap="round"

                  {p.month}
                </text>
              </g>
            ))}
          </svg>
        </div>

                    {currentUser.role === 'student' && (
                      <form onSubmit={handlePostDoubt} className="lg:col-span-5 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                        <h3 className="font-extrabold text-slate-900">Ask Subject Doubt</h3>
                        <p className="text-xs text-slate-500">Attach text, code screenshots, or PDF notes for your subject professor</p>
                        <select
                          value={newDoubt.subject_id}
                          onChange={(e) => setNewDoubt({ ...newDoubt, subject_id: Number(e.target.value) })}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"
                        >
                          {subjects.map((s) => (
                            <option key={s.id} value={s.id}>{s.code} — {s.name}</option>
                          ))}
                        </select>
                        <input
                          type="text"
                          required
                          placeholder="Doubt Topic / Question Title"
                          value={newDoubt.title}
                          onChange={(e) => setNewDoubt({ ...newDoubt, title: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"
                        />
                        <textarea
                          rows={3}
                          required
                          placeholder="Describe your doubt clearly..."
                          value={newDoubt.description}
                          onChange={(e) => setNewDoubt({ ...newDoubt, description: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"
                        />
                        <input
                          type="file"
                          onChange={(e) => setNewDoubt({ ...newDoubt, fileName: e.target.files?.[0]?.name || '' })}
                          className="w-full text-xs"
                        />
                        <button type="submit" className="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-xs font-extrabold shadow">
                          Submit Doubt to Faculty
                        </button>
                      </form>
                    )}

                    <div className={`${currentUser.role === 'student' ? 'lg:col-span-7' : 'lg:col-span-12'} bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3`}>
                      <div className="flex items-center justify-between">
                        <h3 className="font-extrabold text-slate-900">Subject Doubts & Resolution Queue</h3>
                        <div className="flex gap-1">
                          {['All', 'Pending', 'Answered', 'Resolved'].map((f) => (
                            <button
                              key={f}
                              onClick={() => setDoubtFilter(f)}
                              className={`px-3 py-1 rounded-xl text-xs font-bold ${doubtFilter === f ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}
                            >
                              {f}
                            </button>
                          ))}
                        </div>
                      </div>
                      {doubts
                        .filter((d) => doubtFilter === 'All' || d.status === doubtFilter)
                        .map((d) => (
                          <div key={d.id} className="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-2">
                            <div className="flex justify-between">
                              <div>
                                <span className="font-extrabold text-sm">{d.subject_code}: {d.title}</span>
                                <p className="text-[11px] text-slate-500">Asked by {d.student_name} ({d.student_roll}) • Assigned to {d.teacher_name}</p>
                              </div>
                              <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold h-fit ${d.status === 'Resolved' ? 'bg-emerald-100 text-emerald-800' : d.status === 'Answered' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'}`}>
                                {d.status}
                              </span>
                            </div>
                            <p className="text-xs text-slate-700">{d.description}</p>
                            {d.attachment_name && <p className="text-xs text-purple-700 font-bold">Attachment: {d.attachment_name}</p>}
                            {d.teacher_reply && (
                              <div className="p-3 rounded-xl bg-indigo-50 border border-indigo-200 text-xs">
                                <strong>{d.teacher_name}:</strong> {d.teacher_reply}
                              </div>
                            )}

                            {/* Only Teachers/Admin can reply as faculty; Students can mark their doubt Resolved */}
                            {currentUser.role !== 'student' && (
                              <div className="flex gap-2 pt-1">
                                <input
                                  type="text"
                                  placeholder="Write faculty response..."
                                  value={replyTextMap[d.id] || ''}
                                  onChange={(e) => setReplyTextMap({ ...replyTextMap, [d.id]: e.target.value })}
                                  className="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white"
                                />
                                <button
                                  onClick={() => handleTeacherReplyDoubt(d.id, 'Answered')}
                                  className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold"
                                >
                                  Post Reply
                                </button>
                              </div>
                            )}
                            {d.status !== 'Resolved' && (
                              <button
                                onClick={() => setDoubts((prev) => prev.map((x) => (x.id === d.id ? { ...x, status: 'Resolved' } : x)))}
                                className="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold"
                              >
                                Mark as Resolved ✓
                              </button>
                            )}
                          </div>
                        ))}
                    </div>
                  </div>

                  {/* Bidirectional Ratings */}
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <form onSubmit={handleSubmitRating} className="lg:col-span-5 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                      <h3 className="font-extrabold text-slate-900">
                        {currentUser.role === 'student' ? 'Rate Faculty (Teaching, Doubts, Helpfulness)' : 'Evaluate Student (Participation, Discipline, Engagement)'}
                      </h3>
                      <select
                        value={newRating.target_id}
                        onChange={(e) => setNewRating({ ...newRating, target_id: Number(e.target.value) })}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"
                      >
                        {currentUser.role === 'student'
                          ? teachers.map((t) => <option key={t.id} value={t.id}>{t.full_name}</option>)
                          : enrichedStudents.map((s) => <option key={s.student_id} value={s.student_id}>{s.full_name}</option>)}
                      </select>
                      <div className="grid grid-cols-3 gap-2">
                        <input type="number" min="1" max="5" value={newRating.metric_1} onChange={(e) => setNewRating({ ...newRating, metric_1: e.target.value })} className="px-3 py-2 border rounded-xl text-sm" />
                        <input type="number" min="1" max="5" value={newRating.metric_2} onChange={(e) => setNewRating({ ...newRating, metric_2: e.target.value })} className="px-3 py-2 border rounded-xl text-sm" />
                        <input type="number" min="1" max="5" value={newRating.metric_3} onChange={(e) => setNewRating({ ...newRating, metric_3: e.target.value })} className="px-3 py-2 border rounded-xl text-sm" />
                      </div>
                      <textarea
                        rows={2}
                        placeholder="Write constructive feedback..."
                        value={newRating.comment}
                        onChange={(e) => setNewRating({ ...newRating, comment: e.target.value })}
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm"
                      />
                      <button type="submit" className="w-full py-2.5 rounded-xl bg-slate-900 text-white text-xs font-extrabold">
                        Submit Rating & Feedback
                      </button>
                    </form>

                    <div className="lg:col-span-7 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                      <h3 className="font-extrabold text-slate-900">Academic Ratings & Feedback Wall</h3>
                      {ratings.map((r) => (
                        <div key={r.id} className="p-3.5 rounded-2xl border border-slate-200 bg-slate-50 text-xs">
                          <div className="flex justify-between font-bold">
                            <span>{r.from_user_name} &rarr; {r.to_user_name}</span>
                            <span className="text-amber-600 font-extrabold">★ {r.overall_score} / 5.0</span>
                          </div>
                          <p className="text-slate-700 mt-1">{r.comment}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* ====================================================================
                  STUDENT ATTENDANCE ISSUE & LEAVE EXPLANATION
                 ==================================================================== */}
              {activeTab === 'leaves' && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  {currentUser.role === 'student' && (
                    <form onSubmit={handleSubmitLeaveExplanation} className="lg:col-span-5 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                      <h3 className="font-extrabold text-slate-900">Submit Absence Explanation</h3>
                      <p className="text-xs text-slate-500">
                        Policy Guardrail: Submitting an explanation does NOT automatically convert Absent to Present. Only authorized faculty can approve condonation.
                      </p>
                      <input
                        type="date"
                        required
                        value={newLeave.absence_date}
                        onChange={(e) => setNewLeave({ ...newLeave, absence_date: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"
                      />
                      <select
                        value={newLeave.reason_category}
                        onChange={(e) => setNewLeave({ ...newLeave, reason_category: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"
                      >
                        <option value="Medical Emergency">Medical Emergency</option>
                        <option value="Health Issues">Health Issues</option>
                        <option value="Family Emergency">Family Emergency</option>
                        <option value="Personal Reasons">Personal Reasons</option>
                        <option value="Other">Other</option>
                      </select>
                      <textarea
                        rows={3}
                        required
                        placeholder="Write detailed explanation..."
                        value={newLeave.explanation_text}
                        onChange={(e) => setNewLeave({ ...newLeave, explanation_text: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"
                      />
                      <input
                        type="file"
                        onChange={(e) => setNewLeave({ ...newLeave, document_name: e.target.files?.[0]?.name || '' })}
                        className="w-full text-xs"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-purple-600 text-white text-xs font-extrabold shadow">
                        Submit Explanation for Review
                      </button>
                    </form>
                  )}

                  <div className={`${currentUser.role === 'student' ? 'lg:col-span-7' : 'lg:col-span-12'} bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3`}>
                    <h3 className="font-extrabold text-slate-900">
                      {currentUser.role === 'student' ? 'My Submitted Leave Explanations' : 'Student Leave & Medical Explanation Review Desk'}
                    </h3>
                    {leaveRequests
                      .filter((lv) => currentUser.role !== 'student' || lv.student_id === activeStudent.student_id)
                      .map((lv) => (
                        <div key={lv.id} className="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-2 text-xs">
                          <div className="flex justify-between">
                            <span className="font-extrabold text-sm">{lv.student_name} ({lv.roll_number}) — Absence Date: {lv.absence_date}</span>
                            <span className={`px-2.5 py-0.5 rounded-full font-bold ${lv.status === 'Approved' ? 'bg-emerald-100 text-emerald-800' : lv.status === 'Rejected' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}`}>
                              {lv.status}
                            </span>
                          </div>
                          <p className="font-bold text-purple-700">{lv.reason_category} • Proof: {lv.document_name}</p>
                          <p className="text-slate-700">{lv.explanation_text}</p>
                          {lv.reviewer_comment && (
                            <p className="text-[11px] text-slate-600 bg-white p-2.5 rounded-xl border">
                              <strong>Faculty Review ({lv.reviewer_name}):</strong> {lv.reviewer_comment}
                            </p>
                          )}

                          {/* Strictly only Teachers & Admin can approve/reject leave requests! */}
                          {currentUser.role !== 'student' && (
                            <div className="flex gap-2 pt-1">
                              <button
                                onClick={() => setReviewModal({ ...lv, reviewer_comment: 'Verified supporting medical document.' })}
                                className="px-4 py-2 rounded-xl bg-slate-900 hover:bg-purple-600 text-white font-bold transition"
                              >
                                Review & Decide Request
                              </button>
                            </div>
                          )}
                        </div>
                      ))}
                  </div>

                  {reviewModal && currentUser.role !== 'student' && (
                    <div className="fixed inset-0 bg-slate-950/60 flex items-center justify-center p-4 z-50">
                      <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-3 shadow-2xl">
                        <h4 className="font-extrabold text-slate-900">Review Explanation — {reviewModal.student_name}</h4>
                        <p className="text-xs text-slate-500">Choose how to process this student&apos;s absence record:</p>
                        <button
                          onClick={() => handleFinalizeLeaveReview('Approved', false)}
                          className="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold"
                        >
                          Approve Explanation Only (Keep Attendance as Absent)
                        </button>
                        <button
                          onClick={() => handleFinalizeLeaveReview('Approved', true)}
                          className="w-full py-2.5 rounded-xl bg-purple-600 text-white text-xs font-extrabold"
                        >
                          Approve + Convert Absent to Present (Medical Condonation)
                        </button>
                        <button
                          onClick={() => handleFinalizeLeaveReview('Rejected', false)}
                          className="w-full py-2.5 rounded-xl bg-rose-600 text-white text-xs font-extrabold"
                        >
                          Reject Explanation Request
                        </button>
                        <button onClick={() => setReviewModal(null)} className="w-full py-2 rounded-xl bg-slate-100 text-xs font-bold">
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
