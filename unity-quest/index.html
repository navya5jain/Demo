<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>UNITY QUEST</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">

<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>UNITY QUEST</h1>
      <span class="tagline">One game, every ability</span>
    </div>
    <button class="icon-btn" id="settingsShortcut" aria-label="Manage players" title="Manage players">⚙</button>
  </div>
  <main id="app" aria-live="polite"></main>
  <footer class="app-footer">Different ways to play. One fair competition.</footer>
</div>

<script type="module" src="js/main.js"></script>
<script>
  // Quick shortcut: the gear icon always jumps back to player/profile setup.
  document.getElementById('settingsShortcut').addEventListener('click', ()=>{
    window.dispatchEvent(new CustomEvent('unityquest:gotoRoster'));
  });
</script>

</body></html>
